name: Set up build tools
description: Use the locked Nix toolchain on Linux; install current CMake and Ninja on macOS/Windows.

runs:
  using: composite
  steps:
    - name: Install Nix
      if: runner.os == 'Linux'
      uses: cachix/install-nix-action@v31.11.1

    - name: Show locked Linux toolchain
      if: runner.os == 'Linux'
      shell: nix develop --no-update-lock-file --command bash --noprofile --norc -e -o pipefail {0}
      run: |
        cmake --version
        ninja --version
        "$CXX" --version
        clang-tidy --version
        # Codecov runs outside nix develop, but must use this GCC's gcov.
        echo "GCOV=$(command -v gcov)" >> "$GITHUB_ENV"

    - name: Install CMake and Ninja
      if: runner.os != 'Linux'
      shell: bash
      run: |
        python -m pip install --upgrade "cmake>=4.4" ninja
        python - <<'PY'
        import os
        import sysconfig

        with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as path_file:
            print(sysconfig.get_path("scripts"), file=path_file)
        PY

    - name: Show build tool versions
      if: runner.os != 'Linux'
      shell: bash
      run: |
        cmake --version
        ninja --version
