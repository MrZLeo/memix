name: MacOS

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  BUILD_TYPE: Release
  INSTALL_LOCATION: .local
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
  MACOS_DEPLOYMENT_TARGET: '14.0'
  CC: /Library/Developer/CommandLineTools/usr/bin/clang
  CXX: /Library/Developer/CommandLineTools/usr/bin/clang++

jobs:
  build:
    name: Build on macOS 26 for macOS 14+
    runs-on: macos-26
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"

    steps:
    - uses: actions/checkout@v7
      
    - name: cache CPM downloads
      uses: actions/cache@v6
      with:
        path: ${{ env.CPM_SOURCE_CACHE }}
        key: macos-26-arm64-cpm-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'test/**') }}

    - name: select Xcode Command Line Tools
      run: sudo xcode-select --switch /Library/Developer/CommandLineTools

    - name: show compiler
      run: |
        xcode-select --print-path
        "$CXX" --version

    - name: show clang-tidy
      shell: bash
      run: |
        brew install llvm
        clang_tidy="$(brew --prefix llvm)/bin/clang-tidy"
        clang_tidy_cxx_include="$(xcrun --sdk macosx --show-sdk-path)/usr/include/c++/v1"
        test -x "$clang_tidy"
        test -d "$clang_tidy_cxx_include"
        "$clang_tidy" --version
        echo "CLANGTIDY=$clang_tidy" >> "$GITHUB_ENV"
        echo "CLANGTIDY_CXX_INCLUDE=$clang_tidy_cxx_include" >> "$GITHUB_ENV"

    - name: configure
      run: |
        cmake -G Ninja -S . -B build \
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/$INSTALL_LOCATION" \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_DEPLOYMENT_TARGET" \
          -DCPM_SOURCE_CACHE="$CPM_SOURCE_CACHE" \
          -DCLANGTIDY:FILEPATH="$CLANGTIDY" \
          -DCLANGTIDY_EXTRA_ARGS:STRING="-extra-arg-before=-nostdinc++;-extra-arg-before=-isystem;-extra-arg-before=$CLANGTIDY_CXX_INCLUDE" \
          -Dmemix_ENABLE_CLANG_TIDY=ON \
          -Dmemix_WARNINGS_AS_ERRORS=ON
      
    - name: build
      run: cmake --build build --config "$BUILD_TYPE" --parallel 4

    - name: run tests
      run: ctest --test-dir build -C "$BUILD_TYPE" --output-on-failure

    - name: install project
      run: cmake --build build --target install --config "$BUILD_TYPE"

    - name: verify macOS deployment target
      shell: bash
      run: |
        set -euo pipefail
        for binary in build/bin/Release/memix-store build/bin/Release/memix-view build/bin/Release/memix-tui; do
          build_info="$(xcrun vtool -show-build "$binary")"
          printf '%s\n' "$build_info"
          if ! awk -v expected="$MACOS_DEPLOYMENT_TARGET" '
            $1 == "platform" && $2 == "MACOS" { macos = 1 }
            $1 == "minos" { seen = 1; if ($2 != expected) bad = 1 }
            END { exit !(macos && seen && !bad) }
          ' <<<"$build_info"; then
            echo "error: $binary is not a macOS $MACOS_DEPLOYMENT_TARGET+ binary" >&2
            exit 1
          fi
        done

    - name: stage macOS 14 compatibility tests
      shell: bash
      run: |
        mkdir compatibility
        cp build/bin/Release/memix-store compatibility/
        cp build/bin/Release/memix-view compatibility/
        cp build/bin/Release/memix-tui compatibility/
        cp build/test/*_Tests compatibility/

    - name: upload macOS 14 compatibility tests
      uses: actions/upload-artifact@v7
      with:
        name: macos-arm64-compatibility
        path: compatibility/*
        if-no-files-found: error
        compression-level: 0
        retention-days: 1

  macos14:
    name: Run compatibility tests on macOS 14
    runs-on: macos-14
    needs: build

    steps:
    - name: download macOS 14 compatibility tests
      uses: actions/download-artifact@v8
      with:
        name: macos-arm64-compatibility
        path: compatibility

    - name: verify runner and binaries
      shell: bash
      run: |
        set -euo pipefail
        test "$(uname -m)" = "arm64"
        test "$(sw_vers -productVersion | cut -d. -f1)" = "14"

        chmod +x compatibility/*
        for binary in compatibility/*; do
          test "$(lipo -archs "$binary")" = "arm64"
          build_info="$(xcrun vtool -show-build "$binary")"
          if ! awk -v expected="$MACOS_DEPLOYMENT_TARGET" '
            $1 == "platform" && $2 == "MACOS" { macos = 1 }
            $1 == "minos" { seen = 1; if ($2 != expected) bad = 1 }
            END { exit !(macos && seen && !bad) }
          ' <<<"$build_info"; then
            echo "error: $binary is not a macOS $MACOS_DEPLOYMENT_TARGET+ binary" >&2
            exit 1
          fi
        done

    - name: run unit tests
      shell: bash
      run: |
        set -euo pipefail
        export MEMIX_STORE_TEST_BINARY_OVERRIDE="$PWD/compatibility/memix-store"
        export MEMIX_VIEW_TEST_BINARY_OVERRIDE="$PWD/compatibility/memix-view"
        for test_binary in compatibility/*_Tests; do
          "$test_binary"
        done

    - name: run CLI smoke tests
      shell: bash
      run: |
        set -euo pipefail
        store="compatibility/memix-store"
        view="compatibility/memix-view"
        inspect="compatibility/memix-tui"

        store_version="$("$store" --version)"
        view_version="$("$view" --version)"
        inspect_version="$("$inspect" --version)"
        test "$store_version" = "$view_version"
        test "$store_version" = "$inspect_version"
        case "$store_version" in
          'memix '*) ;;
          *)
            echo "error: unexpected version output: $store_version" >&2
            exit 1
            ;;
        esac

        grep -Fq 'Usage: memix-store' <<<"$("$store" --help)"
        grep -Fq 'Usage: memix-view' <<<"$("$view" --help)"
        grep -Fq 'Usage: memix-tui' <<<"$("$inspect" --help)"

        smoke_root="$(mktemp -d "$RUNNER_TEMP/memix-readonly-smoke.XXXXXX")"
        rmdir "$smoke_root"
        test "$("$store" --store-root "$smoke_root/store" list --json)" = '[]'
        test "$("$view" --store-root "$smoke_root/store" status --into "$smoke_root/workspace/.memory")" = 'active: false'
        test ! -e "$smoke_root"

  inspector:
    name: Build the Memix Inspector app
    runs-on: macos-26
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"

    steps:
    - uses: actions/checkout@v7

    - name: cache CPM downloads
      uses: actions/cache@v6
      with:
        path: ${{ env.CPM_SOURCE_CACHE }}
        key: macos-26-arm64-inspector-cpm-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'test/**') }}

    - name: pin the active Xcode developer directory
      run: |
        developer_dir="$(xcode-select -p)"
        echo "active developer dir: $developer_dir"
        echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
        xcrun --find swiftc
        xcrun --sdk macosx --show-sdk-path

    - name: configure
      run: |
        cmake -G Ninja -S . -B build \
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_DEPLOYMENT_TARGET" \
          -Dmemix_BUILD_MACOS_INSPECTOR=ON \
          -DCMAKE_Swift_COMPILER="$(xcrun --find swiftc)" \
          -DCMAKE_OSX_SYSROOT="$(xcrun --sdk macosx --show-sdk-path)"

    - name: build the app
      run: cmake --build build --target memix-inspector --parallel 4
