name: MacOS

on:
  push:
    branches: [ master, experimental ]
  pull_request:
    branches: [ master ]

env:
  BUILD_TYPE: Release
  INSTALL_LOCATION: .local
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
  MACOS_DEPLOYMENT_TARGET: '26.0'
  CC: /Library/Developer/CommandLineTools/usr/bin/clang
  CXX: /Library/Developer/CommandLineTools/usr/bin/clang++

jobs:
  build:
    name: Build and test on macOS 26
    runs-on: macos-26
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-build-tools
      
    - name: cache CPM downloads
      uses: actions/cache@v6
      with:
        path: ${{ env.CPM_SOURCE_CACHE }}
        key: macos-26-arm64-cpm-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'test/**') }}

    - name: select Xcode Command Line Tools
      run: sudo xcode-select --switch /Library/Developer/CommandLineTools

    - name: show compiler
      run: |
        xcode-select --print-path
        "$CXX" --version

    - name: show clang-tidy
      shell: bash
      run: |
        brew install llvm
        clang_tidy="$(brew --prefix llvm)/bin/clang-tidy"
        clang_tidy_cxx_include="$(xcrun --sdk macosx --show-sdk-path)/usr/include/c++/v1"
        test -x "$clang_tidy"
        test -d "$clang_tidy_cxx_include"
        "$clang_tidy" --version
        echo "CLANGTIDY=$clang_tidy" >> "$GITHUB_ENV"
        echo "CLANGTIDY_CXX_INCLUDE=$clang_tidy_cxx_include" >> "$GITHUB_ENV"

    - name: configure
      run: |
        cmake -G Ninja -S . -B build \
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/$INSTALL_LOCATION" \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_DEPLOYMENT_TARGET" \
          -DCPM_SOURCE_CACHE="$CPM_SOURCE_CACHE" \
          -DCLANGTIDY:FILEPATH="$CLANGTIDY" \
          -DCLANGTIDY_EXTRA_ARGS:STRING="-extra-arg-before=-nostdinc++;-extra-arg-before=-isystem;-extra-arg-before=$CLANGTIDY_CXX_INCLUDE" \
          -Dmemix_ENABLE_CLANG_TIDY=ON \
          -Dmemix_WARNINGS_AS_ERRORS=ON
      
    - name: build
      run: cmake --build build --config "$BUILD_TYPE" --parallel 4

    - name: run tests
      run: ctest --test-dir build -C "$BUILD_TYPE" --output-on-failure

    - name: install project
      run: cmake --build build --target install --config "$BUILD_TYPE"

    - name: verify macOS deployment target
      shell: bash
      run: |
        set -euo pipefail
        for binary in build/bin/Release/memix; do
          build_info="$(xcrun vtool -show-build "$binary")"
          printf '%s\n' "$build_info"
          if ! awk -v expected="$MACOS_DEPLOYMENT_TARGET" '
            $1 == "platform" && $2 == "MACOS" { macos = 1 }
            $1 == "minos" { seen = 1; if ($2 != expected) bad = 1 }
            END { exit !(macos && seen && !bad) }
          ' <<<"$build_info"; then
            echo "error: $binary is not a macOS $MACOS_DEPLOYMENT_TARGET+ binary" >&2
            exit 1
          fi
        done

    - name: run CLI smoke tests
      shell: bash
      run: |
        set -euo pipefail
        memix="build/bin/Release/memix"

        memix_version="$("$memix" --version)"
        case "$memix_version" in
          'memix '*) ;;
          *)
            echo "error: unexpected version output: $memix_version" >&2
            exit 1
            ;;
        esac

        grep -Fq 'Usage: memix' <<<"$("$memix" --help)"
        for command in store view tui agent skill; do
          grep -Fq "Usage: memix $command" <<<"$("$memix" "$command" --help)"
          test "$("$memix" "$command" --version)" = "$memix_version"
        done

        smoke_root="$(mktemp -d "$RUNNER_TEMP/memix-readonly-smoke.XXXXXX")"
        rmdir "$smoke_root"
        test "$("$memix" store --store-root "$smoke_root/store" list --json)" = '[]'
        test "$("$memix" view --store-root "$smoke_root/store" status --into "$smoke_root/workspace/.memory")" = 'active: false'
        test ! -e "$smoke_root"

    - name: test installer with the built CLI
      env:
        MEMIX_TEST_BINARY: ${{ github.workspace }}/build/bin/Release/memix
      run: python3 -m unittest discover -s test/scripts -p 'test_*.py' -v

  inspector:
    name: Build the Memix Inspector app
    runs-on: macos-26
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-build-tools

    - name: cache CPM downloads
      uses: actions/cache@v6
      with:
        path: ${{ env.CPM_SOURCE_CACHE }}
        key: macos-26-arm64-inspector-cpm-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'test/**') }}

    - name: pin the active Xcode developer directory
      run: |
        developer_dir="$(xcode-select -p)"
        echo "active developer dir: $developer_dir"
        echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
        xcrun --find swiftc
        xcrun --sdk macosx --show-sdk-path

    - name: configure
      run: |
        cmake -G Ninja -S . -B build \
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_DEPLOYMENT_TARGET" \
          -Dmemix_BUILD_MACOS_INSPECTOR=ON \
          -DCMAKE_Swift_COMPILER="$(xcrun --find swiftc)" \
          -DCMAKE_OSX_SYSROOT="$(xcrun --sdk macosx --show-sdk-path)"

    - name: build the app
      run: cmake --build build --target memix-inspector --parallel 4

    - name: verify Inspector minimum macOS version
      shell: bash
      run: |
        set -euo pipefail
        app="build/macos/MemixInspector/memix-inspector.app"
        test "$(/usr/libexec/PlistBuddy -c 'Print LSMinimumSystemVersion' "$app/Contents/Info.plist")" = "$MACOS_DEPLOYMENT_TARGET"
        build_info="$(xcrun vtool -show-build "$app/Contents/MacOS/memix-inspector")"
        printf '%s\n' "$build_info"
        if ! awk -v expected="$MACOS_DEPLOYMENT_TARGET" '
          $1 == "platform" && $2 == "MACOS" { macos = 1 }
          $1 == "minos" { seen = 1; if ($2 != expected) bad = 1 }
          END { exit !(macos && seen && !bad) }
        ' <<<"$build_info"; then
          echo "error: Inspector does not target macOS $MACOS_DEPLOYMENT_TARGET+" >&2
          exit 1
        fi
