name: Windows

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  BUILD_TYPE: Release
  INSTALL_LOCATION: ".local"
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
  # clang-cl supports C++23 while keeping the MSVC ABI, STL, and static CRT.
  CC: C:/Program Files/LLVM/bin/clang-cl.exe
  CXX: C:/Program Files/LLVM/bin/clang-cl.exe

jobs:
  build:

    runs-on: windows-2025-vs2026
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-build-tools
      
    - name: cache CPM downloads
      uses: actions/cache@v6
      with:
        path: ${{ env.CPM_SOURCE_CACHE }}
        key: ${{ runner.os }}-cpm-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'test/**') }}

    - name: set up MSVC environment
      shell: pwsh
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
        $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $installation) {
          throw "Visual Studio with the x64 C++ toolchain was not found"
        }

        $devcmd = Join-Path $installation "Common7/Tools/VsDevCmd.bat"
        $command = "`"$devcmd`" -no_logo -arch=x64 -host_arch=x64 && set"
        $environment = & $env:COMSPEC /s /c $command
        foreach ($line in $environment) {
          if ($line -match '^([^=]+)=(.*)$') {
            "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
        }

    - name: show compiler
      run: '& "$env:CXX" --version'

    - name: configure
      run: cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE="$env:BUILD_TYPE" -DCMAKE_INSTALL_PREFIX="$HOME/$env:INSTALL_LOCATION" -DCPM_SOURCE_CACHE="$env:CPM_SOURCE_CACHE" -DCMAKE_LINKER_TYPE=LLD
      
    - name: build
      run: cmake --build build --config "$env:BUILD_TYPE" -j4

    - name: run tests
      run: |
        cd build
        ctest -C "$env:BUILD_TYPE" -VV

    - name: install project
      run: cmake --build build --target install --config Release 
