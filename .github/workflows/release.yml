name: Release

on:
  push:
    tags:
      - 'v*'

env:
  BUILD_TYPE: Release
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Linux x86_64 GCC
            os: ubuntu-24.04
            asset: linux-x86_64
            cc: gcc-14
            cxx: g++-14
          - name: Windows x86_64 MSVC
            os: windows-2025-vs2026
            asset: windows-x86_64
            cc: cl
            cxx: cl
          - name: macOS arm64 Clang
            os: macos-26
            asset: macos-arm64
            cc: /Library/Developer/CommandLineTools/usr/bin/clang
            cxx: /Library/Developer/CommandLineTools/usr/bin/clang++

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: cache CPM downloads
        uses: actions/cache@v5
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: ${{ runner.os }}-cpm-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'test/**') }}

      - name: select Xcode Command Line Tools
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Library/Developer/CommandLineTools

      - name: set up MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) {
            throw "Visual Studio with the x64 C++ toolchain was not found"
          }

          $devcmd = Join-Path $installation "Common7/Tools/VsDevCmd.bat"
          $command = "`"$devcmd`" -no_logo -arch=x64 -host_arch=x64 && set"
          $environment = & $env:COMSPEC /s /c $command
          foreach ($line in $environment) {
            if ($line -match '^([^=]+)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

      - name: configure
        env:
          CC: ${{ matrix.config.cc }}
          CXX: ${{ matrix.config.cxx }}
        run: cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release -Dmemix_STATIC_LINK=ON

      - name: build
        run: cmake --build build --parallel 4

      - name: run tests
        run: ctest --test-dir build --output-on-failure

      - name: verify static Linux executables
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for binary in build/bin/Release/memix-store build/bin/Release/memix-view; do
            file "$binary"
            "$binary" --version
            if readelf -l "$binary" | grep -q 'INTERP'; then
              echo "error: $binary contains a dynamic ELF interpreter" >&2
              exit 1
            fi
          done

      - name: verify self-contained macOS executables
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for binary in build/bin/Release/memix-store build/bin/Release/memix-view; do
            file "$binary"
            "$binary" --version
            unexpected=$(otool -L "$binary" | tail -n +2 | awk '{print $1}' | grep -Ev '^(/usr/lib/|/System/Library/)' || true)
            if [[ -n "$unexpected" ]]; then
              echo "error: $binary has non-system dynamic dependencies:" >&2
              echo "$unexpected" >&2
              exit 1
            fi
          done

      - name: verify static Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binaries = @(
            "build/bin/Release/memix-store.exe",
            "build/bin/Release/memix-view.exe"
          )
          foreach ($binary in $binaries) {
            & $binary --version
            $dependencies = & dumpbin /dependents $binary
            if ($LASTEXITCODE -ne 0) {
              throw "dumpbin failed for $binary"
            }
            if ($dependencies -match '(?i)(vcruntime|msvcp|ucrtbase).*\.dll') {
              throw "$binary depends on a dynamic MSVC runtime"
            }
          }

      - name: stage Unix executables
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir dist
          cp build/bin/Release/memix-store "dist/memix-store-${{ matrix.config.asset }}"
          cp build/bin/Release/memix-view "dist/memix-view-${{ matrix.config.asset }}"

      - name: stage Windows executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item build/bin/Release/memix-store.exe "dist/memix-store-${{ matrix.config.asset }}.exe"
          Copy-Item build/bin/Release/memix-view.exe "dist/memix-view-${{ matrix.config.asset }}.exe"

      - name: upload executables
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config.asset }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      actions: read
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "Release $GITHUB_REF_NAME" --verify-tag

      - name: download executables
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: package Codex skill
        run: tar -czf memix-cli-skill.tar.gz -C skill memix-cli

      - name: upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" artifacts/*/* memix-cli-skill.tar.gz
