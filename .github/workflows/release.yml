name: Release

on:
  push:
    tags:
      - 'v*'

env:
  PROJECT_NAME: "memix"
  BUILD_TYPE: Release
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "Windows 2025 VS 2026 MSVC",
            artifact_ext: '.zip',
            os: windows-2025-vs2026,
            cc: "cl",
            cxx: "cl",
            environment_script: "C:/Program Files (x86)/Microsoft Visual Studio/2019/Enterprise/VC/Auxiliary/Build/vcvars64.bat",
          }
        - {
            name: "Ubuntu Latest GCC",
            artifact_ext: '.tar.gz',
            os: ubuntu-latest,
            cc: "gcc",
            cxx: "g++",
          }
        - {
            name: "macOS 26 Clang",
            artifact_ext: '.tar.gz',
            os: macos-26,
            cc: "/Library/Developer/CommandLineTools/usr/bin/clang",
            cxx: "/Library/Developer/CommandLineTools/usr/bin/clang++",
          }

    steps:
    - name: set version name (Windows)
      id: version_win
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        $TAG = (${env:GITHUB_REF} -replace 'refs/tags/', '')
        echo "name=$TAG" >> ${env:GITHUB_OUTPUT}
    
    - name: set version name
      id: version
      if: ${{ runner.os != 'Windows' }}
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        echo "name=$TAG" >> "$GITHUB_OUTPUT"

    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: cache CPM downloads
      uses: actions/cache@v5
      with:
        path: ${{ env.CPM_SOURCE_CACHE }}
        key: ${{ runner.os }}-cpm-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'test/**') }}

    - name: select Xcode Command Line Tools
      if: ${{ runner.os == 'macOS' }}
      run: sudo xcode-select --switch /Library/Developer/CommandLineTools

    - name: show compiler
      if: ${{ runner.os == 'macOS' }}
      env:
        CXX: ${{ matrix.config.cxx }}
      run: |
        xcode-select --print-path
        "$CXX" --version

    - name: configure (Windows)
      if: ${{ runner.os == 'Windows' }}
      run: cmake -Bbuild -DCMAKE_INSTALL_PREFIX="$HOME/.local" -DCPM_SOURCE_CACHE="$env:CPM_SOURCE_CACHE"

    - name: configure (Linux)
      if: ${{ runner.os == 'Linux' }}
      env:
        CC: gcc-14
        CXX: g++-14
      run: cmake -Bbuild -DCMAKE_INSTALL_PREFIX="$HOME/.local" -DCPM_SOURCE_CACHE="$CPM_SOURCE_CACHE"

    - name: configure
      if: ${{ runner.os != 'Windows' && runner.os != 'Linux' }}
      env:
        CC: ${{ matrix.config.cc }}
        CXX: ${{ matrix.config.cxx }}
      run: cmake -G Ninja -Bbuild -DCMAKE_INSTALL_PREFIX="$HOME/.local" -DCPM_SOURCE_CACHE="$CPM_SOURCE_CACHE"
      
    - name: build (Windows)
      if: ${{ runner.os == 'Windows' }}
      run: cmake --build build --config "$env:BUILD_TYPE" -j4

    - name: build
      if: ${{ runner.os != 'Windows' }}
      run: cmake --build build --config "$BUILD_TYPE" -j4

    - name: run tests (Windows)
      if: ${{ runner.os == 'Windows' }}
      run: |
        cd build
        ctest -C "$env:BUILD_TYPE" -VV

    - name: run tests
      if: ${{ runner.os != 'Windows' }}
      run: |
        cd build
        ctest -C "$BUILD_TYPE" -VV

    # for a release not containing directly the source code, replace the files archived
    # with the actual files needed (i.e. *.lib/*.a and *.h(pp))

    - name: generate archive (Windows)
      if: ${{ runner.os == 'Windows' }}
      run: |
        rmdir -r -fo build
        7z a -tzip $HOME/artifact.zip *


    - name: generate archive
      if: ${{ runner.os != 'Windows' }}
      run: |
        rm -rf build
        tar -cvzf $HOME/artifact.tar.gz .

    - name: upload artifacts
      uses: actions/upload-artifact@v7
      if: ${{ runner.os == 'Windows' }}
      with:
        name: ${{ runner.os }}-${{ steps.version_win.outputs.name }}
        path: '~/artifact.*'

    - name: upload artifacts
      uses: actions/upload-artifact@v7
      if: ${{ runner.os != 'Windows' }}
      with:
        name: ${{ runner.os }}-${{ steps.version.outputs.name }}
        path: '~/artifact.*'

  release:
    if: contains(github.ref, 'tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: write

    steps:
    - name: set version name
      id: version
      run: echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

    - name: create release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create "${{ steps.version.outputs.name }}" --title "Release ${{ steps.version.outputs.name }}" --verify-tag

    - name: download linux artifact
      uses: actions/download-artifact@v7
      with:
        name: "Linux-${{ steps.version.outputs.name }}"
        path: ./

    - name: upload ubuntu release asset
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "${{ steps.version.outputs.name }}" "artifact.tar.gz#${{ env.PROJECT_NAME }}-Linux-${{ steps.version.outputs.name }}.tar.gz"

    - name: download windows artifact
      uses: actions/download-artifact@v7
      with:
        name: "Windows-${{ steps.version.outputs.name }}"
        path: ./

    - name: upload windows release asset
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "${{ steps.version.outputs.name }}" "artifact.zip#${{ env.PROJECT_NAME }}-Windows-${{ steps.version.outputs.name }}.zip"

    - name: download macos artifact
      uses: actions/download-artifact@v7
      with:
        name: "macOS-${{ steps.version.outputs.name }}"
        path: ./

    - name: upload macos release asset
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "${{ steps.version.outputs.name }}" "artifact.tar.gz#${{ env.PROJECT_NAME }}-macOS-${{ steps.version.outputs.name }}.tar.gz"
