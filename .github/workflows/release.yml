name: Release

on:
  push:
    tags:
      - 'v*'

env:
  BUILD_TYPE: Release
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
  MACOS_DEPLOYMENT_TARGET: '14.0'

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Linux x86_64 GCC
            os: ubuntu-24.04
            asset: linux-x86_64
            cc: gcc-14
            cxx: g++-14
          - name: Windows x86_64 MSVC
            os: windows-2025-vs2026
            asset: windows-x86_64
            cc: cl
            cxx: cl
          - name: macOS arm64 Clang
            os: macos-26
            asset: macos-arm64
            cc: /Library/Developer/CommandLineTools/usr/bin/clang
            cxx: /Library/Developer/CommandLineTools/usr/bin/clang++

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: cache CPM downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: ${{ matrix.config.os }}-${{ matrix.config.asset }}-cpm-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'test/**') }}

      - name: select Xcode for the SwiftUI Inspector build
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

      - name: set up MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) {
            throw "Visual Studio with the x64 C++ toolchain was not found"
          }

          $devcmd = Join-Path $installation "Common7/Tools/VsDevCmd.bat"
          $command = "`"$devcmd`" -no_logo -arch=x64 -host_arch=x64 && set"
          $environment = & $env:COMSPEC /s /c $command
          foreach ($line in $environment) {
            if ($line -match '^([^=]+)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

      - name: configure
        if: runner.os != 'macOS'
        env:
          CC: ${{ matrix.config.cc }}
          CXX: ${{ matrix.config.cxx }}
        run: cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release -Dmemix_STATIC_LINK=ON -Dmemix_ENABLE_LTO=ON

      - name: configure macOS 14-compatible binaries
        if: runner.os == 'macOS'
        env:
          CC: ${{ matrix.config.cc }}
          CXX: ${{ matrix.config.cxx }}
        run: |
          # CMake derives the Swift compiler from the C++ toolchain directory,
          # which points at the Command Line Tools whose swiftc cannot build.
          # Pin the compiler from the selected Xcode instead.
          swift_compiler="$(xcrun --find swiftc)"
          "$swift_compiler" --version
          cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_DEPLOYMENT_TARGET" \
            -Dmemix_STATIC_LINK=ON \
            -Dmemix_ENABLE_LTO=ON \
            -Dmemix_BUILD_MACOS_INSPECTOR=ON \
            -DCMAKE_Swift_COMPILER="$swift_compiler"

      - name: build
        run: cmake --build build --parallel 4

      - name: run tests
        run: ctest --test-dir build --output-on-failure

      - name: verify static Linux executables
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for binary in build/bin/Release/memix-store build/bin/Release/memix-view build/bin/Release/memix-tui; do
            file "$binary"
            "$binary" --version
            if readelf -l "$binary" | grep -q 'INTERP'; then
              echo "error: $binary contains a dynamic ELF interpreter" >&2
              exit 1
            fi
          done

      - name: verify self-contained macOS executables
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for binary in build/bin/Release/memix-store build/bin/Release/memix-view build/bin/Release/memix-tui; do
            file "$binary"
            "$binary" --version

            build_info="$(xcrun vtool -show-build "$binary")"
            printf '%s\n' "$build_info"
            if ! awk -v expected="$MACOS_DEPLOYMENT_TARGET" '
              $1 == "platform" && $2 == "MACOS" { macos = 1 }
              $1 == "minos" { seen = 1; if ($2 != expected) bad = 1 }
              END { exit !(macos && seen && !bad) }
            ' <<<"$build_info"; then
              echo "error: $binary is not a macOS $MACOS_DEPLOYMENT_TARGET+ binary" >&2
              exit 1
            fi

            unexpected="$(otool -L "$binary" | awk '
              NR > 1 && $1 !~ "^/usr/lib/" && $1 !~ "^/System/Library/" {
                print $1
              }
            ')"
            if [[ -n "$unexpected" ]]; then
              echo "error: $binary has non-system dynamic dependencies:" >&2
              echo "$unexpected" >&2
              exit 1
            fi
          done

      - name: verify and package the Memix Inspector app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="build/macos/MemixInspector/memix-inspector.app"
          test -d "$app"
          xcrun vtool -show-build "$app/Contents/MacOS/memix-inspector"
          # Ad-hoc signature: the release has no Developer ID identity, but a
          # signature keeps Gatekeeper diagnostics and zip metadata sane.
          codesign --force --sign - "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/MemixInspector-${{ matrix.config.asset }}.zip"
          ls -lh "dist/MemixInspector-${{ matrix.config.asset }}.zip"

      - name: verify static Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binaries = @(
            "build/bin/Release/memix-store.exe",
            "build/bin/Release/memix-view.exe",
            "build/bin/Release/memix-tui.exe"
          )
          foreach ($binary in $binaries) {
            & $binary --version
            $dependencies = & dumpbin /dependents $binary
            if ($LASTEXITCODE -ne 0) {
              throw "dumpbin failed for $binary"
            }
            if ($dependencies -match '(?i)(vcruntime|msvcp|ucrtbase).*\.dll') {
              throw "$binary depends on a dynamic MSVC runtime"
            }
          }

      - name: stage Unix executables
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir dist
          cp build/bin/Release/memix-store "dist/memix-store-${{ matrix.config.asset }}"
          cp build/bin/Release/memix-view "dist/memix-view-${{ matrix.config.asset }}"
          cp build/bin/Release/memix-tui "dist/memix-tui-${{ matrix.config.asset }}"
          strip "dist/memix-store-${{ matrix.config.asset }}" "dist/memix-view-${{ matrix.config.asset }}" "dist/memix-tui-${{ matrix.config.asset }}"
          ls -lh dist

      - name: stage Windows executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item build/bin/Release/memix-store.exe "dist/memix-store-${{ matrix.config.asset }}.exe"
          Copy-Item build/bin/Release/memix-view.exe "dist/memix-view-${{ matrix.config.asset }}.exe"
          Copy-Item build/bin/Release/memix-tui.exe "dist/memix-tui-${{ matrix.config.asset }}.exe"

      - name: upload executables
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config.asset }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  macos14:
    name: Verify release binaries on macOS 14
    runs-on: macos-14
    needs: build
    permissions:
      actions: read
      contents: read

    steps:
      - name: download macOS arm64 executables
        uses: actions/download-artifact@v8
        with:
          name: macos-arm64
          path: dist

      - name: verify runner and release binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "14"

          mkdir -p "$RUNNER_TEMP/memix-bin"
          install -m 0755 dist/memix-store-macos-arm64 "$RUNNER_TEMP/memix-bin/memix-store"
          install -m 0755 dist/memix-view-macos-arm64 "$RUNNER_TEMP/memix-bin/memix-view"
          install -m 0755 dist/memix-tui-macos-arm64 "$RUNNER_TEMP/memix-bin/memix-tui"

          for binary in "$RUNNER_TEMP/memix-bin/memix-store" "$RUNNER_TEMP/memix-bin/memix-view" "$RUNNER_TEMP/memix-bin/memix-tui"; do
            test "$(lipo -archs "$binary")" = "arm64"
            build_info="$(xcrun vtool -show-build "$binary")"
            printf '%s\n' "$build_info"
            if ! awk -v expected="$MACOS_DEPLOYMENT_TARGET" '
              $1 == "platform" && $2 == "MACOS" { macos = 1 }
              $1 == "minos" { seen = 1; if ($2 != expected) bad = 1 }
              END { exit !(macos && seen && !bad) }
            ' <<<"$build_info"; then
              echo "error: $binary is not a macOS $MACOS_DEPLOYMENT_TARGET+ binary" >&2
              exit 1
            fi

            unexpected="$(otool -L "$binary" | awk '
              NR > 1 && $1 !~ "^/usr/lib/" && $1 !~ "^/System/Library/" {
                print $1
              }
            ')"
            if [[ -n "$unexpected" ]]; then
              echo "error: $binary has non-system dynamic dependencies:" >&2
              echo "$unexpected" >&2
              exit 1
            fi
          done

      - name: run release CLI smoke tests
        shell: bash
        run: |
          set -euo pipefail
          store="$RUNNER_TEMP/memix-bin/memix-store"
          view="$RUNNER_TEMP/memix-bin/memix-view"
          inspect="$RUNNER_TEMP/memix-bin/memix-tui"

          store_version="$("$store" --version)"
          view_version="$("$view" --version)"
          inspect_version="$("$inspect" --version)"
          test "$store_version" = "$view_version"
          test "$store_version" = "$inspect_version"
          grep -Fq 'Usage: memix-store' <<<"$("$store" --help)"
          grep -Fq 'Usage: memix-view' <<<"$("$view" --help)"
          grep -Fq 'Usage: memix-tui' <<<"$("$inspect" --help)"

          smoke_root="$(mktemp -d "$RUNNER_TEMP/memix-readonly-smoke.XXXXXX")"
          rmdir "$smoke_root"
          test "$("$store" --store-root "$smoke_root/store" list --json)" = '[]'
          test "$("$view" --store-root "$smoke_root/store" status --into "$smoke_root/workspace/.memory")" = 'active: false'
          test ! -e "$smoke_root"

  release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs: [build, macos14]
    permissions:
      actions: read
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "Release $GITHUB_REF_NAME" --verify-tag

      - name: download executables
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: package Codex skill
        run: tar -czf memix-cli-skill.tar.gz -C skill memix-cli

      - name: upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" artifacts/*/* memix-cli-skill.tar.gz
